name: Petclinic CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Indir
        uses: actions/checkout@v4

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test et ve Build Yap
        run: ./mvnw clean package -DskipTests

      - name: Docker Hub'a Giris Yap
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker Imajini Olustur ve Gonder
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/petclinic:v1

      - name: Kind Kur (Kind)
        uses: helm/kind-action@v1.9.0

      - name: Kind Durumunu Kontrol Et
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes via Helm
        run: |
          helm upgrade --install spring-petclinic-release ./petclinic-chart \
            --set mysql.rootPassword=${{ secrets.MYSQL_ROOT_PASSWORD }}

      - name: Uygulama ve MySQL Durumunu Kontrol Et
        run: |
          echo "--- Pod Durumları ---"
          kubectl get pods
          
          echo "--- Servis Durumları ---"
          kubectl get services

          echo "--- MySQL Logları Kontrolü ---"
          kubectl logs deployment/spring-petclinic-release-mysql --tail=50 || true

          echo "--- Spring Boot Logları Kontrolü ---"
          kubectl logs deployment/spring-petclinic-release --tail=50 || true

      - name: Arayüzü (HTTP) Test Et
        run: |
          kubectl port-forward svc/spring-petclinic-release 8080:8080 &
          sleep 5
          curl -I http://localhost:8080
